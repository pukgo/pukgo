name: Supabase keepalive

on:
  schedule:
    - cron: '0 3 */3 * *'   # 3일마다 실행 (한국 시간 정오 무렵)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/characters?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"
          echo "Supabase keepalive OK"
